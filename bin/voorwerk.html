<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Voorwerk</title>
<style>
  :root{
    --paper:#FCF7EE; --card:#FFFDF7; --ink:#1B2A26;
    --teal:#0F3D3A; --teal2:#16514C; --teal-soft:#E4EEEA;
    --marigold:#F6B12B; --coral:#FF6A4D; --line:#DfD6C4;
  }
  @page{size:A4; margin:14mm}
  *{box-sizing:border-box}
  body{margin:0; background:#fff; color:var(--ink);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    -webkit-print-color-adjust:exact; print-color-adjust:exact}
  .blad{page-break-after:always; min-height:263mm; display:flex; flex-direction:column}
  .blad:last-child{page-break-after:auto}

  /* ---------- voorblad ---------- */
  .kop{display:flex; gap:10px; align-items:center; margin-bottom:auto}
  .chip{background:var(--teal); color:#fff; border-radius:999px; padding:7px 15px;
    font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase}
  .chip.licht{background:transparent; color:var(--teal); border:2px solid var(--teal)}
  .eyebrow{display:flex; align-items:center; gap:10px; font-size:12px; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase; color:var(--teal)}
  .eyebrow::before{content:""; width:30px; height:3px; background:var(--marigold)}
  h1{font-size:46px; line-height:1.03; letter-spacing:-.025em; color:var(--teal);
    margin:12px 0 0; font-weight:800}
  h1 em{font-style:normal; color:var(--coral)}
  .onder{font-size:16px; line-height:1.5; color:#3d4b45; margin:14px 0 22px; max-width:118mm}
  .beeld{border-radius:18px; overflow:hidden; border:2px solid var(--line)}
  .beeld img{display:block; width:100%; height:auto}
  .invul{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:18px}
  .invul .lbl{display:block; font-size:10px; font-weight:800; letter-spacing:.14em;
    text-transform:uppercase; color:#7b8a83; margin-bottom:16px}
  .invul .lijn{display:block; border-bottom:1.5px solid var(--line)}
  .voet{margin-top:auto; padding-top:16px; border-top:2px solid var(--teal);
    display:flex; justify-content:space-between; gap:16px; font-size:12px; color:#54635c}
  .voet b{color:var(--teal)}

  /* ---------- inhoudsopgave ---------- */
  .ih-kop{border-bottom:3px solid var(--teal); padding-bottom:8px; margin-bottom:4px}
  .ih-kop h2{font-size:26px; color:var(--teal); margin:0; letter-spacing:-.01em}
  .ih-intro{font-size:13px; color:#54635c; margin:10px 0 16px; line-height:1.5}
  .deel{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
    color:var(--coral); margin:18px 0 6px}
  ol.ih{list-style:none; margin:0; padding:0; counter-reset:h}
  ol.ih li{display:flex; align-items:baseline; gap:8px;
    padding:7px 0; border-bottom:1px dotted var(--line); font-size:14.5px}
  ol.ih li .t{font-weight:600; color:var(--ink)}
  ol.ih li .stip{flex:1; border-bottom:1px dotted var(--line); transform:translateY(-3px)}
  ol.ih li .p{font-family:ui-monospace,Menlo,monospace; font-size:13px;
    font-weight:700; color:var(--teal)}
  .tip{margin-top:20px; background:var(--teal-soft); border-left:5px solid var(--teal);
    border-radius:0 12px 12px 0; padding:12px 16px; font-size:13px; line-height:1.55}
  .tip b{color:var(--teal)}
  .tip a{color:var(--teal2)}
</style>
</head>
<body>

<!-- ══════════ VOORBLAD ══════════ -->
<section class="blad">
  <div class="kop">
    <span class="chip">__VAK__</span>
    <span class="chip licht">__DUUR__</span>
    <span class="chip licht">__EDITIE__</span>
  </div>

  <div class="eyebrow">Tentoonstelling · Staatsbosbeheer</div>
  <h1>Automata voor <em>Staatsbosbeheer</em></h1>
  <p class="onder">__ONDER__</p>

  <div class="beeld"><img src="__FOTO__" alt=""></div>

  __INVUL__

  <div class="voet">
    <span><b>Staatsbosbeheer</b> · tentoonstelling “Natuur in beweging”</span>
    <span>__EDITIE__</span>
  </div>
</section>

<!-- ══════════ INHOUDSOPGAVE ══════════ -->
<section class="blad">
  <div class="ih-kop"><h2>Inhoud</h2></div>
  <p class="ih-intro">__IHINTRO__</p>
  __ITEMS__
  <div class="tip">__TIP__</div>
</section>

</body>
</html>
